{% extends "base.html" %} 

{% block title %} Home {% endblock %}

<script src="static/website.js"></script>

{% block heading %}
<h1> <b> Welcome to Timothy's Rare Animal Emporium </b> </h1>
<h2> Purchase a new exotic friend (safe and legal!!) </h2>
{% endblock %}

{% block content %} 
<div class="homebox"> 
    <p>
        <figure>
            <img src="{{products[0][3]}}" alt="A {{products[0][1]}}" width="250" height="120" style="float: right; padding-left: 20px;">
            <figcaption> 
                <h3> {{products[0][1]}} - ${{products[0][4]}} </h3> 
                <p>
                    {{products[0][2]}} <br>
                    {{products[0][5]}} <br> <br>
                    <button class="button"> <a href="capybara"> Learn More </a> </button>
                    <form method="POST"> <button class="button" name="product-id" value="{{1}}"> Purchase </button> </form>
                </p>
            </figcaption>
        </figure>
    </p>
</div>
